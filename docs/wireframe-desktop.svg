<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Comic Sans MS','Chalkboard SE','Segoe Print',cursive" font-size="14" fill="#0B2240">
  <rect width="960" height="600" fill="#FBFBF8"/>
  <g fill="none" stroke="#0B2240" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="20" width="920" height="560" rx="12"/>
    <!-- HUD -->
    <path d="M20 76 H940"/>
    <circle cx="50" cy="48" r="11" stroke="#E09B00"/>
    <circle cx="470" cy="48" r="20" stroke="#E09B00" stroke-width="3"/>
    <rect x="740" y="34" width="50" height="28" rx="4"/><rect x="800" y="34" width="44" height="28" rx="4"/>
    <rect x="852" y="40" width="8" height="12" rx="2" fill="#FF4D79" stroke="none"/><rect x="864" y="40" width="8" height="12" rx="2" fill="#FF4D79" stroke="none"/><rect x="876" y="40" width="8" height="12" rx="2"/>
    <rect x="898" y="32" width="30" height="30" rx="8"/>
    <!-- globe -->
    <circle cx="330" cy="330" r="220"/>
    <path d="M130 300 q60 -20 120 10 t120 0 t120 -20" stroke="#9AA6B2"/>
    <path d="M150 380 q80 30 160 0 t160 20" stroke="#9AA6B2"/>
    <path d="M330 110 q-80 220 0 440" stroke="#9AA6B2"/>
    <path d="M190 250 l40 -10 l30 30 l-10 40 l-50 0 z" fill="#36D6C8" stroke="#0B2240"/>
    <path d="M260 270 l50 -10 l20 30 l-30 30 l-30 -10 z" fill="#FFB000" stroke="#0B2240"/>
    <path d="M330 290 l40 0 l10 40 l-40 10 l-20 -20 z" fill="#F9E3A0" stroke="#E09B00" stroke-dasharray="4 3"/>
    <path d="M420 380 l40 -10 l20 40 l-50 10 z" fill="#FF4D79" stroke="#0B2240"/>
    <path d="M215 275 L285 285 L350 312" stroke="#E09B00" stroke-width="3"/>
    <!-- controls -->
    <rect x="36" y="470" width="30" height="30" rx="8"/><rect x="36" y="506" width="30" height="30" rx="8"/><rect x="36" y="542" width="30" height="30" rx="8" />
    <!-- visa page -->
    <rect x="600" y="90" width="320" height="476" rx="18"/>
    <rect x="608" y="98" width="304" height="460" rx="14" stroke-dasharray="4 4" stroke="#9AA6B2"/>
    <rect x="620" y="110" width="120" height="22" rx="6"/>
    <circle cx="660" cy="230" r="34" stroke="#0F7A55"/><circle cx="660" cy="230" r="28" stroke="#0F7A55" stroke-width="1"/>
    <rect x="712" y="198" width="66" height="62" rx="8" stroke="#5B3FA0" transform="rotate(6 745 229)"/>
    <polygon points="815,196 845,196 862,213 862,243 845,260 815,260 798,243 798,213" stroke="#C0265A"/>
    <rect x="620" y="512" width="135" height="36" rx="10"/><rect x="765" y="512" width="135" height="36" rx="10"/>
    <!-- arrival card -->
    <rect x="140" y="470" width="360" height="96" rx="16" fill="#0B2240"/>
    <rect x="400" y="490" width="86" height="34" rx="10" fill="#FFB000" stroke="none"/>
  </g>
  <text x="68" y="53" font-weight="bold">Overland</text>
  <text x="461" y="54" font-weight="bold">47</text>
  <text x="745" y="53" font-size="11">Score</text><text x="804" y="53" font-size="11">3/9</text>
  <text x="350" y="100" font-size="12" fill="#586473">clock ring: 60 s, +3 s per step closer, +10 s for a shortest route</text>
  <text x="626" y="126" font-size="11">Level 1, Day tripper</text>
  <text x="624" y="160" font-size="11" fill="#586473">From</text><text x="860" y="160" font-size="11" fill="#586473">To</text>
  <text x="624" y="182" font-weight="bold" font-size="18">Turkey</text><text x="826" y="182" font-weight="bold" font-size="18">Portugal</text>
  <text x="641" y="234" font-size="10" fill="#0F7A55">TURKEY</text>
  <text x="716" y="234" font-size="10" fill="#5B3FA0">BULGARIA</text>
  <text x="808" y="234" font-size="10" fill="#C0265A">SERBIA</text>
  <text x="624" y="300" font-size="12" fill="#586473">passport stamps: one per border crossed</text>
  <text x="624" y="490" font-size="12">In Serbia. Keep heading for Portugal.</text>
  <text x="660" y="535" font-size="13">Undo</text><text x="780" y="535" font-size="13">Skip (-1 life)</text>
  <text x="160" y="500" font-size="12" fill="#FFB000">Arrived in Portugal</text>
  <text x="160" y="526" font-size="18" fill="#fff" font-weight="bold">5 crossings</text>
  <text x="160" y="552" font-size="11" fill="#B8C2CE">+700 route  +150 speed  x1.5</text>
  <text x="408" y="512" font-size="12">Next route</text>
  <text x="170" y="210" font-size="12" fill="#0F7A55">start (aqua)</text>
  <text x="470" y="420" font-size="12" fill="#C0265A">goal (rose)</text>
  <text x="370" y="300" font-size="12" fill="#A35200">neighbours glow at level 1</text>
  <text x="76" y="560" font-size="11" fill="#586473">zoom / fit route</text>
  <text x="128" y="150" font-size="12" fill="#586473">D3 orthographic globe: drag to spin, scroll to zoom, tap to cross</text>
</svg>
